name: Apply Company Foundation Story

on:
  push:
    branches:
      - content/company-foundation-story-20260907
    paths:
      - .github/workflows/apply-company-foundation-story.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Add exact foundation story and styling
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
          node --check assets/site-enhancements.js
          git diff --check
          git diff -- assets/site-enhancements.js assets/case-study-split.css
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-enhancements.js assets/case-study-split.css
          git commit -m "content: add foundation story to company introduction"
          git push
