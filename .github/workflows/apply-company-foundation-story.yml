name: Apply Company Foundation Story

on:
  push:
    branches:
      - content/company-foundation-story-20260907
    paths:
      - .github/workflows/apply-company-foundation-story.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Add exact foundation story and styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/site-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          function_marker = '  function patchEmptySemantics(){'
          call_marker = '      patchEmptySemantics();'
          if js.count(function_marker) != 1:
              raise SystemExit(f'Expected one patchEmptySemantics marker, found {js.count(function_marker)}')
          if js.count(call_marker) != 1:
              raise SystemExit(f'Expected one patchEmptySemantics call, found {js.count(call_marker)}')
          if 'function patchFoundationStory(){' in js:
              raise SystemExit('Foundation story patch already exists unexpectedly')

          function_block = '''  function appendStoryParagraph(container,text){
            var paragraph=document.createElement('p');
            paragraph.textContent=text;
            container.appendChild(paragraph);
            return paragraph;
          }

          function patchFoundationStory(){
            var company=document.querySelector('#company');
            if(!company)return;

            var lang=currentLanguage();
            var story=company.querySelector('.company-foundation-story');
            if(story){
              story.hidden=lang!=='en';
              return;
            }

            var list=company.querySelector('.company-intro-list');
            if(!list)return;

            story=document.createElement('div');
            story.className='company-foundation-story';
            story.setAttribute('lang','en');
            story.setAttribute('aria-labelledby','company-foundation-story-title');
            story.hidden=lang!=='en';

            var heading=document.createElement('h3');
            heading.id='company-foundation-story-title';
            heading.textContent='Sweet Spot’s Foundation Story and Purpose';
            story.appendChild(heading);

            appendStoryParagraph(story,'Sam’s experience across rights holders (WTA, FIFA), agencies (Octagon, CSM) and brands (AIG) has provided a comprehensive appreciation of the sports ecosystem and objectives and challenges across the various parties. In particular, the 8 years leading AIG’s sports marketing function ensured a focus on maximizing sponsorship benefits to achieve tangible business results.');

            appendStoryParagraph(story,'Sweet Spot was founded to share this solution-focused experience and offer high level facilitation to multiple clients.');

            var nameParagraph=document.createElement('p');
            nameParagraph.appendChild(document.createTextNode('The name represents the sweet feeling when perfectly hitting a ball with the middle part of the bat, racquet or club. The logo brings together an ancient quartz crystal in the center of a traditional Mexican '));
            var serape=document.createElement('em');
            serape.textContent='serape';
            nameParagraph.appendChild(serape);
            nameParagraph.appendChild(document.createTextNode('.'));
            story.appendChild(nameParagraph);

            appendStoryParagraph(story,'Welcome to the Sweet Spot!');

            list.insertAdjacentElement('afterend',story);
          }

'''
          js = js.replace(function_marker, function_block + function_marker, 1)
          js = js.replace(call_marker, '      patchFoundationStory();\n' + call_marker, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/case-study-split.css')
          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* Company Foundation Story — full-text editorial block */'
          if css_marker in css:
              raise SystemExit('Foundation story CSS already exists unexpectedly')

          css_block = '''/* Company Foundation Story — full-text editorial block */
          #company .company-foundation-story[hidden]{
            display:none!important;
          }

          #company .company-foundation-story{
            position:relative;
            z-index:2;
            width:min(100%,980px);
            margin:38px auto 0;
            padding:30px 22px 0;
            border-top:1px solid rgba(215,169,54,.38);
          }

          #company .company-foundation-story h3{
            margin:0 0 22px;
            color:#fff;
            font-size:clamp(24px,2.3vw,32px);
            font-weight:800;
            line-height:1.18;
            letter-spacing:-.025em;
          }

          #company .company-foundation-story p{
            margin:0;
            max-width:900px;
            color:#cdd3db;
            font-size:clamp(15px,1.15vw,17px);
            font-weight:400;
            line-height:1.8;
          }

          #company .company-foundation-story p+p{
            margin-top:18px;
          }

          #company .company-foundation-story em{
            color:#fff;
          }

          #company .company-foundation-story p:last-child{
            color:var(--gold-pale);
            font-weight:800;
          }

          @media(max-width:760px){
            #company .company-foundation-story{
              margin-top:30px;
              padding:24px 12px 0;
            }

            #company .company-foundation-story h3{
              margin-bottom:18px;
              font-size:23px;
              line-height:1.22;
            }

            #company .company-foundation-story p{
              font-size:15px;
              line-height:1.72;
            }

            #company .company-foundation-story p+p{
              margin-top:16px;
            }
          }'''
          css_path.write_text(css.rstrip() + '\n\n' + css_block + '\n', encoding='utf-8')

          exact_text = [
              'Sweet Spot’s Foundation Story and Purpose',
              'Sam’s experience across rights holders (WTA, FIFA), agencies (Octagon, CSM) and brands (AIG) has provided a comprehensive appreciation of the sports ecosystem and objectives and challenges across the various parties. In particular, the 8 years leading AIG’s sports marketing function ensured a focus on maximizing sponsorship benefits to achieve tangible business results.',
              'Sweet Spot was founded to share this solution-focused experience and offer high level facilitation to multiple clients.',
              'The name represents the sweet feeling when perfectly hitting a ball with the middle part of the bat, racquet or club. The logo brings together an ancient quartz crystal in the center of a traditional Mexican ',
              "serape.textContent='serape';",
              "appendStoryParagraph(story,'Welcome to the Sweet Spot!');",
          ]
          updated_js = js_path.read_text(encoding='utf-8')
          for text in exact_text:
              if text not in updated_js:
                  raise SystemExit(f'Missing expected exact story text: {text}')
          if updated_js.count('function patchFoundationStory(){') != 1:
              raise SystemExit('Foundation story function count is not one')
          if updated_js.count('patchFoundationStory();') != 1:
              raise SystemExit('Foundation story apply call count is not one')
          if css_path.read_text(encoding='utf-8').count(css_marker) != 1:
              raise SystemExit('Foundation story CSS marker count is not one')
          PY
          node --check assets/site-enhancements.js
          git diff --check
          git diff -- assets/site-enhancements.js assets/case-study-split.css
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-enhancements.js assets/case-study-split.css
          git commit -m "content: add foundation story to company introduction"
          git push
